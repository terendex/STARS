version: "0.1"
name: "Alathfar"
author: "Axel Jonas C. Tangalin"
attribution: "Made by Axel Jonas C. Tangalin"
category: "Lyra (Forensics)"
type: standard
value: 60
# Dynamic scoring: starts at 60, then every solve takes 3 off for
# everyone who has solved it, down to 30.
extra:
  function: linear
  initial: 60
  decay: 3
  minimum: 30
attempts: 3
description: |-
  This is a recording of network traffic at the Lyra Observatory, captured while an astronomer logged in to the file server. The file server uses **FTP**, an old way of sending files that doesn't encrypt anything, not even passwords. Anyone watching the network can read them.

  **Your goal:** find the password the astronomer logged in with. That password is the flag.

  Download the recording, `alathfar_capture.pcap`, below and open it in [Wireshark](https://www.wireshark.org/), a free tool for inspecting network traffic.

  **Tools you may need to solve this level:** Wireshark
files:
  - dist/alathfar_capture.pcap
flags:
  - "STARS{4l4thf4r_ftp_s3nds_1t_pl41n}"
tags:
  - "★★ Medium"
hints:
  - content: "In Wireshark, type `ftp` in the filter bar and press Enter. Each line is one command or reply. Look for the commands that send a password."
    cost: 5
  - content: "FTP sends the password in a `PASS` command. There are two: the first login failed (the reply says so), the second worked."
    cost: 10
state: visible
