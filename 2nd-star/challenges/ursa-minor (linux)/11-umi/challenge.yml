hints:
  - content: "`nc -z` checks whether a port is open without sending anything, and it accepts a range like `4000-4999`. Add `-v` to see a result for every port."
    cost: 10
  - content: "`nc -zv beacon 4000-4999 2>&1 | grep succeeded` prints only the open port (`2>&1` lets `grep` see nc's messages). Then `nc beacon <that port>`."
    cost: 10
