description: |-
  11 Ursae Minoris is an orange giant with a planet of its own. The observatory set up a beacon for it on a **private network** that only the server can reach. Your own computer can't, so this has to be done after you log in.

  The beacon's address is the name `beacon`. It listens on **one port** somewhere between **4000 and 4999** and sends the flag to anyone who connects to that port. Trying a thousand ports by hand would take forever, but there are tools that check whole ranges of ports at once. That's called a **port scan**.

  **Your goal:** find the one open port on `beacon`, connect to it, and read the flag it sends. After it prints, press **Ctrl+C** to get back to the prompt.

  Log in with the command below and the password `beaconhunt`. The account is named `umi11`.

  **Commands you may need to solve this level:** `nc`, `grep`
connection_info: ssh umi11@192.168.68.104 -p 2220
