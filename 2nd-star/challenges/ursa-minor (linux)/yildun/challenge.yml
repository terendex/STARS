description: |-
  Yildun sits in the handle of the Little Dipper. Its record was filed somewhere inside a folder called `archive`, which holds two years of seasons, each with folders for many other stars.

  **Your goal:** find the file called `star_record.txt` somewhere inside `archive` and read the flag in it.

  Log in with the command below and the password `littlebear`. Use `ls` to see what's in a folder, `cd name` to go into one, and `cd ..` to come back out. Opening every folder by hand works, but it's slow.

  **Commands you may need to solve this level:** `ls`, `cd`, `cat`, `find`
