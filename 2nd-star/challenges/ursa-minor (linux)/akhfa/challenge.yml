category: "Ursa Minor (Linux)"
type: standard
value: 100
# Dynamic scoring: starts at 100, then every solve takes 5 off for
# everyone who has solved it, down to 50.
extra:
  function: linear
  initial: 100
  decay: 5
  minimum: 50
attempts: 3
description: |-
  Akhfa's name means "the dimmer one", and its signal is just as hard to see. `signal.dat` in your home folder was wrapped in several layers before it was stored, and some kinds of wrapping were used more than once.

  **Your goal:** unwrap `signal.dat` one layer at a time until the flag appears.

  Log in with the command below and the password `dimmerstar`. Your home folder is read-only, so work in `/tmp`. Every team shares this login, so make a folder named after your team (for example `mkdir /tmp/yourteam`) and keep your files in it.

  `file` tells you what kind of file you have. `base64 -d`, `gunzip` and `tar` can each undo a layer.
connection_info: ssh akhfa@192.168.68.101 -p 2220
flags:
  - "STARS{4khf4_p33l3d_3v3ry_l4y3r}"
tags:
  - "★★★ Hard"
hints:
  - content: "Start with `base64 -d ~/signal.dat > /tmp/yourteam/step1`, then run `file` on the result. `gunzip -c in > out` unwraps gzip without needing a `.gz` name, and `tar -xf` writes out the files inside an archive."
    cost: 10
  - content: "The layers are Base64, gzip, Base64 again, tar, and finally gzip."
    cost: 20
state: visible
