description: |-
  Kochab is one of the two Guardians of the Pole, circling Polaris all night. Its `charts` folder holds 900 star charts, split across 12 sector folders, and every one of them contains a line that looks like a flag. Only one is real.

  **Your goal:** find the one chart that is **exactly 2048 bytes** and **owned by the user `cartographer`**, and read the flag inside it. Checking 900 files by hand would take all night.

  Log in with the command below and the password `guardians`.

  **Commands you may need to solve this level:** `ls`, `cd`, `cat`, `find`, `grep`
connection_info: ssh kochab@192.168.68.104 -p 2220
flags:
  - "STARS{k0ch4b_m4pp3d_th3_n0rth}"
tags:
  - "★★ Medium"
hints:
  - content: "`find` can search all the sector folders at once, and it can filter by both size and owner. In `-size`, the suffix `c` means bytes."
    cost: 5
  - content: "`find ~/charts -type f -size 2048c -user cartographer` prints the one file. `grep flag:` on it prints the flag line."
    cost: 10
state: visible
