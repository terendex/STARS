description: |-
  Edasich scrambles the password you type in three steps, then compares the result with a scrambled copy of the real password that it keeps in `edasich.py`. You can't make the program unscramble it for you, but you can read exactly how the scrambling works.

  **Your goal:** undo the scrambling to recover the password, then run `python3 edasich.py` and type it in. The program prints the flag.

  Log in with the command below and the password `draco`.

  **Tools you may need to solve this level:** `cat`, `python3`, [CyberChef](https://gchq.github.io/CyberChef/)
connection_info: ssh edasich@192.168.8.109 -p 2222
flags:
  - "STARS{3d4s1ch_unw0und_th3_c01ls}"
tags:
  - "★★ Medium"
hints:
  - content: "To undo a process, undo its steps in the opposite order, like taking off socks and shoes. `.hex()` was the last step, so undo it first, and undo the shift last."
    cost: 5
  - content: "In CyberChef, paste the scrambled password and use **From Hex**, then **Reverse**, then **ROT13** with **Amount** set to `21` (moving 21 letters forward is the same as 5 back)."
    cost: 5
state: visible
