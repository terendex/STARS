description: |-
  Alsafi never writes its password down. Instead, `alsafi.py` checks your guess one letter at a time, and it checks the letters in a jumbled order, so the password doesn't read straight off the screen.

  In Python, `guess[0]` means the first letter of `guess`, `guess[1]` the second, and so on: Python counts positions from 0, not 1.

  **Your goal:** work out the password from the checks, then run `python3 alsafi.py` and type it in. The program prints the flag.

  Log in with the command below and the password `draco`.

  **Tools you may need to solve this level:** `cat`, `python3`
connection_info: ssh alsafi@192.168.68.103 -p 2222
