description: |-
  Rastaban, in the dragon's head, guards its flag with a password, and its program is written in Python. Python programs are plain text, so you can read every line of `rastaban.py`. But the password isn't written as letters this time.

  Computers store every letter as a number, called its **character code**: `A` is 65, `B` is 66, and lowercase `a` is 97. Rastaban keeps its password as a list of those numbers.

  **Your goal:** turn the numbers back into the password, then run `python3 rastaban.py` and type it in. The program prints the flag.

  Not sure what a piece of Python does? Try it out. Type `python3` on its own to open Python, then type the piece you're unsure about and press Enter to see what it gives. Type `exit()` to leave.

  Log in with the command below and the password `draco`.

  **Tools you may need to solve this level:** `cat`, `python3`, [CyberChef](https://gchq.github.io/CyberChef/)
connection_info: ssh rastaban@192.168.8.109 -p 2222
