hints:
  - content: "The program builds the password itself, in the line starting `password =`. In `python3`, `chr(97)` gives `'a'`. Paste that line's right-hand side, with `CODES` swapped for the list of numbers in its square brackets, and Python shows the password."
    cost: 5
