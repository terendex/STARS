description: |-
  Altais receives a message from deep space, decodes it in memory, then scrubs it without ever showing it. The message is the flag, and it only exists for a moment while the program runs.

  To see it, you need to pause the program at the right moment and look inside. That's what a **debugger** does, and this server has one called `gdb`. In gdb, `info functions` lists the program's functions, and Altais's have helpful names.

  **Your goal:** stop `altais` before it scrubs the message, and read the flag from its memory.

  gdb may warn that it can't find `altais.c`. That's normal: you have the program, not the code it was written from.

  Log in with the command below and the password `draco`.

  **Commands you may need to solve this level:** `gdb`
connection_info: ssh altais@192.168.8.109 -p 2222
flags:
  - "STARS{4lt41s_p4us3d_m1d_m3ss4g3}"
tags:
  - "★★ Medium"
hints:
  - content: "Start with `gdb ./altais`. `break scrub_message` tells gdb to pause when the program reaches that function, and `run` starts the program."
    cost: 5
  - content: "When gdb pauses at `scrub_message`, type `info args`. It shows what the function was given, which is the message it's about to wipe. Type `quit` to leave gdb."
    cost: 5
state: visible
