hints:
  - content: "Run `ltrace ./kuma`. `getenv` is short for get environment variable: the text in its brackets is the name Kuma asks for, and `nil` means it isn't set."
    cost: 5
  - content: "Now set that variable to anything, by putting `NAME=hello` (with the real name) in front of `ltrace ./kuma`. Kuma has something to compare this time: find the `strcmp` line."
    cost: 5
