description: |-
  Kuma is one of the four stars in the dragon's head. Its program doesn't ask you anything. Instead, it reads a setting from its **environment**: named values, called environment variables, that the terminal hands to every program it starts.

  To give a program an environment variable for one run, write it in front of the command, like `COLOR=blue ./kuma`.

  You don't need to read the program to find out which setting it wants, or what value. `ltrace` runs a program and shows every library function it calls, along with what it passes in. Put `ltrace` in front of the command you'd normally type.

  **Your goal:** find the setting Kuma is waiting for and the value it wants, then run `./kuma` with that setting. The program prints the flag.

  Log in with the command below and the password `draco`.

  **Commands you may need to solve this level:** `ltrace`
connection_info: ssh kuma@192.168.8.109 -p 2222
