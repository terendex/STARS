description: |-
  Tabit's night archive holds the flag, but the instant the page loads, it sends your browser somewhere else. That's called a **redirect**, and it happens so fast you never see the first page. Even pressing Ctrl+U shows you the code of the page you ended up on, not the one you wanted.

  The trick is to read the first page without letting your browser follow the redirect.

  **Your goal:** read the archive page at the address below before your browser leaves it. The flag is on that page.

  **Tools you may need to solve this level:** View page source, your browser's developer tools (F12), or `curl.exe` in PowerShell
connection_info: http://192.168.68.103:8088
flags:
  - "STARS{t4b1t_bl1nk_4nd_y0u_m1ss_1t}"
tags:
  - "★ Easy"
hints:
  - content: "If you type `view-source:` in front of an address in the address bar, the browser shows that page's code without running it, so nothing redirects you. Type the address yourself rather than pressing Ctrl+U."
    cost: 5
  - content: "Another way: in PowerShell, `curl.exe` followed by the address prints the page's code and doesn't follow this kind of redirect."
    cost: 5
state: visible
