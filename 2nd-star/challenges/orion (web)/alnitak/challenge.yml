description: |-
  Alnitak's star catalog has the same weakness as Rigel: it pastes whatever you type into a database query. There's no login to bypass this time. The flag is stored in **another table** in the same database, and you don't know that table's name.

  The catalog runs on **SQLite**. `UNION SELECT` lets you add rows from another query to the search results, as long as your query returns as many columns as the catalog shows.

  **Your goal:** open the catalog at the address below, find the hidden table's name, then use the search box to read the flag out of it.
connection_info: http://192.168.8.109:8086
flags:
  - "STARS{4ln1t4k_un10n_s3l3ct_d33p3r}"
tags:
  - "★★★ Hard"
hints:
  - content: "Count the columns in the results. Then search for `' UNION SELECT 1, 2, 3, 4 -- ` (with a space at the end). The numbers appear as a row, which shows the injection works."
    cost: 10
  - content: "SQLite lists its tables in one called `sqlite_master`. Its `name` and `sql` columns tell you what every table is called and what's in it."
    cost: 20
state: visible
