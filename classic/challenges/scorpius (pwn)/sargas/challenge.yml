description: |-
  The flag costs 1000 credits at the Sargas Star Shop, and you only have 100. Star maps cost 10 credits each. The shop checks that you can afford what you buy, but does it check everything?

  **Your goal:** buy the flag. The shop prints it when you do.

  **How to connect:** open a terminal (on Windows, that's PowerShell), run the command below, and enter the password `scorpius`. It takes you straight into the program. If you have `nc`, you can use port 9033 instead.

  The program's source code is attached below as a download. Reading it is how you find the weakness.

  **Commands you may need to solve this level:** `ssh`, `nc`
