version: "0.1"
name: "Kepler-62"
author: "Axel Jonas C. Tangalin"
attribution: "Made by Axel Jonas C. Tangalin"
category: "Lyra (Forensics)"
type: standard
value: 30
# Dynamic scoring: starts at 30, then every solve takes 1 off for
# everyone who has solved it, down to 15.
extra:
  function: linear
  initial: 30
  decay: 1
  minimum: 15
attempts: 3
description: |-
  Kepler-62 is a star in Lyra with five planets. This report about it is a Word document, but its photo was taken out before it was released.

  A `.docx` file is secretly a **zip archive**: a bundle of smaller files holding the text, the formatting and the pictures. When someone deletes a picture from the page, it can stay inside that bundle.

  **Your goal:** look inside `kepler-62_report.docx` (download it below) and find the picture that was taken off the page. The flag is written in it. Capitals don't matter. You don't need Word.

  **Tools you may need to solve this level:** File Explorer, or 7-Zip
files:
  - dist/kepler-62_report.docx
flags:
  - type: static
    content: "STARS{DOCX_IS_JUST_A_ZIP}"
    data: case_insensitive
tags:
  - "★ Easy"
hints:
  - content: "Rename the file so it ends in `.zip` instead of `.docx`, then double-click it. If you can't see `.docx` in the name, turn on file name extensions in File Explorer's **View** menu."
    cost: 5
  - content: "Pictures in a Word document live in the `word` folder, inside a folder called `media`."
    cost: 5
state: visible
