description: |-
  Aladfar's observation report was "redacted" before it was released: someone hid the secret parts under black boxes. But drawing a black box over text in a PDF doesn't delete the text. It only covers it up.

  **Your goal:** recover the line hidden under the long black box in `aladfar_report.pdf` (download it below). The flag is on it.

  **Tools you may need to solve this level:** A PDF viewer (your browser works), Notepad
files:
  - dist/aladfar_report.pdf
