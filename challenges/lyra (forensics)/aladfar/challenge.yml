  - "STARS{4l4df4r_r3d4ct3d_b4dly}"
tags:
  - "★ Easy"
hints:
  - content: "Open the PDF in your browser, press **Ctrl+A** to select everything, then **Ctrl+C** to copy it. Paste into Notepad, and the text under the boxes is there."
