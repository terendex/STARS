description: |-
  This is a recording of network traffic at the Lyra Observatory, captured while an astronomer logged in over plain, unencrypted HTTP. Anything sent that way can be read by anyone watching the network.

  **Your goal:** find the password the astronomer logged in with. That password is the flag.

  Files like this open in [Wireshark](https://www.wireshark.org/), a free tool for inspecting network traffic.

  **Tools you may need to solve this level:** Wireshark
