description: |-
  Alifa didn't leave its signal in a file. When you log in, the shell keeps a list of named settings called **environment variables**, and every program you start gets a copy of that list. The server put Alifa's signal into one of yours.

  **Your goal:** find the environment variable that holds the flag, and read its value.

  Log in with the command below and the password `inherited`.

  **Commands you may need to solve this level:** `env`, `grep`
connection_info: ssh alifa@192.168.68.103 -p 2220
