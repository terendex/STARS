description: |-
  Akhfa's name means "the dimmer one", and its signal is just as hard to see. `signal.dat` in your home folder was wrapped in several layers before it was stored.

  **Your goal:** unwrap `signal.dat` one layer at a time until the flag appears.

  Log in with the password `hiddenstar`. Your home folder is read-only, so work in `/tmp`. Every team shares this login, so make a folder named after your team (for example `mkdir /tmp/yourteam`) and keep your files in it.

  `file` tells you what kind of file you have. `base64 -d`, `gunzip` and `tar` can each undo a layer.
