hints:
  - content: "Can't find her name? Work it out instead. The cipher only changes letters, so the `{` is still there, and the five letters right before it decrypt to `STARS`. Put just those five letters through **Vigenère Decode** with `STARS` as the key, and the output is the keyword."
    cost: 5
  - content: "The keyword is `HELEN`."
