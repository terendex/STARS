description: |-
  Wasat means "middle", and it sits between the twins. Its message uses a **Vigenère cipher**, which is like a Caesar cipher except that each letter is shifted by a different amount, set by a keyword.

  The keyword is five letters long. It's the word for what Castor and Pollux are to each other.

  **Your goal:** decrypt `message.txt` (download it below) with the keyword and read the flag. A wrong keyword just gives gibberish, and it doesn't use up any of your flag attempts.

  **Tools you may need to solve this level:** CyberChef (`Vigenère Decode`)
files:
  - dist/message.txt
flags:
  - "STARS{w4s4t_k3pt_th3_k3y}"
tags:
  - "★★ Medium"
hints:
  - content: "Can't guess it? Work it out instead. The cipher only changes letters, so the `{` is still there, and the five letters right before it decrypt to `STARS`. Put just those five letters through **Vigenère Decode** with `STARS` as the key, and the output is the keyword."
    cost: 5
  - content: "The keyword is `TWINS`."
    cost: 5
