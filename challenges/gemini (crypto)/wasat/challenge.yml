description: |-
  Wasat means "middle", and it sits between the twins. Its message uses a **Vigenère cipher**, which shifts each letter by a different amount according to a keyword.

  Nobody wrote the keyword down this time. All you know is that it's five letters long, and that you already know how part of the message reads, because you know how every flag begins.

  **Your goal:** work out the keyword, then use it to decrypt `message.txt` and read the flag.

  **Tools you may need to solve this level:** CyberChef (`Vigenère Decode`)
