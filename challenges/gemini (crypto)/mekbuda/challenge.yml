attempts: 3
description: |-
  Mekbuda's relay still sends the old way: short and long beeps, written down as dots and dashes. Each group of dots and dashes is one letter, and each line of `message.txt` is one word. Sailors and radio operators used this code for over a century, and it's named after one of its inventors.

  The message spells out the flag's words after `FLAG WORDS FOLLOW`. This code has no curly brackets or underscores, so **write the flag yourself**: put those words, joined by underscores, inside `STARS{}`. For example, the words `RED GIANT` would make the flag `STARS{RED_GIANT}`. Capitals don't matter.

  **Your goal:** decode `message.txt` (download it below) and turn the flag's words into the flag.

  **Tools you may need to solve this level:** [CyberChef](https://gchq.github.io/CyberChef/)
files:
  - dist/message.txt
flags:
  - type: static
    content: "STARS{SIGNAL_IN_THE_STATIC}"
    data: case_insensitive
tags:
  - "★ Easy"
hints:
  - content: "It's **Morse code**. CyberChef's **From Morse Code** reads this file as it is."
    cost: 5
state: visible
