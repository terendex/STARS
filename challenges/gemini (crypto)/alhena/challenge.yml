description: |-
  Alhena's message looks a lot like Pollux's Base64 at first glance, but look closer. Base64 is named after the 64 different symbols it writes with. Alhena's encoding uses **half as many**: only the capital letters `A` to `Z` and the digits `2` to `7`, with some `=` at the end.

  **Your goal:** work out which encoding that is, then decode `message.txt` (download it below) to read the flag.

  **Tools you may need to solve this level:** [CyberChef](https://gchq.github.io/CyberChef/)
