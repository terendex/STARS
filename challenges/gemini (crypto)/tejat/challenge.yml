description: |-
  Tejat shares its patch of sky with a neighbor once called Tejat Prior, and the two relay messages to each other using **RSA**, the system that protects much of the web. Each station publishes a number `n`, made by multiplying two secret primes. Anyone who can split `n` back into those primes can work out the private key and read that station's messages.

  These keys are 2048 bits long, so no computer on Earth can split one on its own. But both stations got their keys from the same cheap generator, and it was running low on primes.

  We intercepted a message sent to Tejat. `transmission.txt` holds both stations' `n`, the public exponent `e` they share, and the encrypted message `c`.

  **Your goal:** recover Tejat's two primes, use them to decrypt `c`, and read the flag.

  You don't need to write any code. Free online big-number calculators and RSA decoders handle numbers this size.
