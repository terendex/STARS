hints:
  - content: "If two numbers have a factor in common, you don't need to split either one to find it. Their greatest common divisor (GCD) gives it to you instantly, even for numbers this big. On [Alpertron's calculator](https://www.alpertron.com.ar/ECM.HTM), type `Gcd(first number, second number)` and press **Only evaluate**."
    cost: 10
  - content: "With one prime `p`, the other is Tejat's `n` divided by `p`, and Alpertron's `/` works that out too. Then [dcode's RSA Cipher tool](https://www.dcode.fr/rsa-cipher) decrypts for you: fill in `C`, `E`, `N` (Tejat's), `P` and `Q`, and choose to show the plaintext as a character string."
    cost: 20
