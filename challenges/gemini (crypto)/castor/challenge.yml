description: |-
  Castor is one half of the Gemini twins, and its transmission comes in two layers as well.

  The outer layer is an encoding you'll see all over the web. The inner one is a cipher that's about 2,000 years old and named after a Roman general. It moves every letter the same number of places along the alphabet.

  **Your goal:** undo both layers of `transmission.txt` to read the flag.

  **Tools you may need to solve this level:** [CyberChef](https://gchq.github.io/CyberChef/)
