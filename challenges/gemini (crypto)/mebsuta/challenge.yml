description: |-
  Mebsuta's message is written in hex, but decoding the hex only gives you gibberish. It was also encrypted with **XOR**, using a key that repeats for the whole message. XOR undoes itself, so the key that locked the message also unlocks it.

  The key is four capital letters: the name of the Gemini twins' mother in Greek myth.

  **Your goal:** decode the hex, then XOR the result with the key to read the flag. CyberChef's **XOR** reads its key as hex unless you switch the key's format to **UTF8**, so switch it before typing letters.

  **Tools you may need to solve this level:** CyberChef (`From Hex`, `XOR`)
