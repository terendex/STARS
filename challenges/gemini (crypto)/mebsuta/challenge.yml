version: "0.1"
name: "Mebsuta"
author: "STARS"
category: "Gemini (Crypto)"
type: standard
value: 60
attempts: 3
description: |-
  Mebsuta's message is written in hex, but decoding the hex only gives you gibberish. It was also encrypted with **XOR**, using a key that's several bytes long and repeats for the whole message.

  There are far too many possible keys to try them all. Luckily, Mebsuta always opens its transmissions with the flag, and you know how every flag begins.

  **Your goal:** recover the XOR key, then use it to decrypt `message.txt` and read the flag.

  **Tools you may need to solve this level:** CyberChef (`From Hex`, `XOR`)
files:
  - dist/message.txt
flags:
  - "STARS{m3bsut4_r3p34t1ng_x0r}"
tags:
  - "★★ Medium"
hints:
  - content: "XOR undoes itself. If `ciphertext = plaintext XOR key`, then `key = ciphertext XOR plaintext`, and you know how the plaintext starts."
    cost: 5
  - content: "In CyberChef, use **From Hex**, then **XOR** with `STARS{` as a UTF8 key. Only the first six characters of the output mean anything, and they show the key starting to repeat."
    cost: 10
state: visible
