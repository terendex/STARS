description: |-
  Start here if you've never done crypto before. Pollux, the brightest star in Gemini, has sent a message in **Base64**. Base64 is an encoding rather than a cipher: there's no key, and anyone can reverse it.

  **Your goal:** decode `message.txt` to read the flag. Every flag in this CTF looks like `STARS{...}`.

  **How to decode it with CyberChef:**

  1. Click `message.txt` below to download it, open it (Notepad works), and copy everything in it.
  2. Open [CyberChef](https://gchq.github.io/CyberChef/) and paste it into the **Input** box at the top right.
  3. In the search box at the top left, above the list of operations, type `base64`.
  4. Drag **From Base64** into the **Recipe** column in the middle.
  5. The decoded message appears in the **Output** box at the bottom right.

  **Then:** submit only the `STARS{...}` part, not the words before it. You'll use CyberChef this way for most of Gemini.

  **Tools you may need to solve this level:** [CyberChef](https://gchq.github.io/CyberChef/)
