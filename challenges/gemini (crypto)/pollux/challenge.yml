description: |-
  Pollux, the brightest star in Gemini, has sent a message in **Base64**. Base64 is an encoding rather than a cipher: there's no key, and anyone can reverse it.

  **Your goal:** decode `message.txt` to read the flag. Paste its contents into CyberChef's **Input** box and find the operation that reverses Base64.

  **Tools you may need to solve this level:** [CyberChef](https://gchq.github.io/CyberChef/)
