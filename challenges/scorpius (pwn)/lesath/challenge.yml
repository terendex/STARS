description: |-
  The Lesath visitor desk gives you a name tag with space for 16 characters, and right next to it in memory is the value that says whether you're an astronomer.

  What happens when a name doesn't fit? This is called a **buffer overflow**.

  **Your goal:** get the desk to treat you as an astronomer. It gives astronomers the flag.

  **How to connect:** open a terminal (on Windows, that's PowerShell), run the command below, and enter the password `scorpius`. It takes you straight into the program. If you have `nc`, you can use port 9004 instead.

  The program's source code is attached below as a download. Reading it is how you find the weakness.

  **Commands you may need to solve this level:** `ssh`, `nc`
