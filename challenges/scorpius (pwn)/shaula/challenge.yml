description: |-
  Start here if you've never done pwn. "Pwn" means finding a weakness in a running program and making it do something it shouldn't. This is the gentlest possible start.

  The Shaula Sky Tour shows you a menu with three choices, but its source code, the code the program was written from, tells a different story.

  **Your goal:** use what you find in the source code to make the program print the flag.

  **How to do it:**

  1. Click `shaula.c` below to download it, and open it in Notepad.
  2. Find the part that decides what each menu choice does. Is there a choice the menu doesn't show you?
  3. Open a terminal (on Windows, that's PowerShell), run the command below, and enter the password `scorpius`. Nothing appears as you type the password, which is normal. It takes you straight into the program.
  4. Type the hidden choice and press Enter.

  If you know `nc`, port 9002 works too.

  **Commands you may need to solve this level:** `ssh`
