description: |-
  Acrab's radio relay repeats your callsign back to you. In C, `printf` treats codes like `%p` and `%s` as instructions to read data from memory, and this program passes your input straight to it. This is called a **format string** bug.

  **Your goal:** the flag is sitting in the program's memory, but the program never prints it. Use the bug to read it out.

  **How to connect:** open a terminal (on Windows, that's PowerShell), run the command below, and enter the password `scorpius`. It takes you straight into the program. If you have `nc`, you can use port 9006 instead.

  The program's source code is attached below as a download. Reading it is how you find the weakness.

  **Commands you may need to solve this level:** `ssh`, `nc`
