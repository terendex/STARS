hints:
  - content: "The buffer is 64 bytes, and 8 more bytes of saved data sit before the return address. That's 72 bytes in total."
    cost: 10
  - content: "Addresses are stored backwards (little-endian) in 8 bytes. On the SSH box, `printf 'AAAA\\x12\\x34' | nc antares 9001` sends those exact bytes. Replace them with 72 A's followed by the address."
