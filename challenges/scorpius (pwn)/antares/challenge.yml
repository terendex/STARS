description: |-
  Antares, the red heart of Scorpius, is near the end of its life. Its core monitor takes a fusion reading and logs it, but it's never been told what to do with a reading that's too big.

  The program has a function called `supernova` that nothing ever calls, and it even tells you where that function is. Overflow the buffer far enough to overwrite the **return address**, the place the program goes back to when a function ends, and send it to `supernova`.

  **Your goal:** make the program run `supernova`, which prints the flag.

  This one needs raw bytes, so a normal keyboard won't do. If you don't have `nc` on your computer, log in to any Ursa Minor account (Pherkad's works) and run `nc antares 9001` from there. It works the same way.
