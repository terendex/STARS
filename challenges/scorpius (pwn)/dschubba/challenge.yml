description: |-
  This is a buffer overflow again, but it has to be exact now. Your name can spill into the access key, and the key has to end up holding one specific number. The source code shows which number.

  The program shows you what ended up in the key, in hexadecimal, so you can see how close you are.

  **Your goal:** make the key hold exactly the right number. The program prints the flag when it does.

  **How to connect:** Run the command below and enter the password `scorpius`. It takes you straight into the program. If you have `nc`, you can use port 9005 instead.

  The program's source code is attached. Reading it is how you find the weakness.

  **Commands you may need to solve this level:** `ssh`, `nc`
