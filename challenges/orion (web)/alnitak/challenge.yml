hints:
  - content: "Search for `' UNION SELECT 1, 2, 3 -- ` (with a space at the end). The numbers appear as a row, which shows the injection works."
    cost: 10
  - content: "SQLite lists its tables in one called `sqlite_master`. Its `name` and `sql` columns tell you what every table is called and what's in it."
    cost: 20
