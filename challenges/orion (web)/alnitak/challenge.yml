description: |-
  Alnitak's star catalog has the same weakness as Rigel: it pastes whatever you type into a database query. There's no login to bypass this time. The flag is stored in **another table** in the same database, and you don't know that table's name.

  The catalog runs on **SQLite**. `UNION SELECT` lets you add rows from another query to the search results. The catalog shows 3 columns, so your query has to return 3 as well.

  **Your goal:** find the hidden table's name, then use the search box to read the flag out of it.
