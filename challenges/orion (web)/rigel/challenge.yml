description: |-
  Rigel Observatory runs its telescope from a staff portal. The telescope key is shown only to staff with the highest clearance, and you don't have an account.

  The portal checks your login by pasting exactly what you type into a database query. Type the right symbols and you can change what that query means.

  **Your goal:** open the staff portal at the address below, and sign in as a staff member who's allowed to see the telescope key. That key is the flag.

  **Tools you may need to solve this level:** SQL injection with `'`, `OR` and `--`
