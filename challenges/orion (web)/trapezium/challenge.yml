description: |-
  The Trapezium is a cluster of young stars at the heart of the Orion Nebula. Its website loads each page's text from a file in a folder called `pages`, and the address says which file to open: `?page=welcome.txt`. The site opens whatever name you give it, without checking where that file is.

  The flag is in a file called `flag.txt`, which is kept **one folder above** `pages`. Reaching outside the folder you're meant to stay in is called **path traversal**.

  **Your goal:** change the address so the site opens `flag.txt` instead of a page.

  **Tools you may need to solve this level:** Your browser's address bar
