description: |-
  Alnilam's dome only opens for commanders. The site decides who you are by reading a cookie, a small note the website stores in your browser, and you can edit your own cookies.

  **Your goal:** open Alnilam's site at the address below and make it believe your rank is **commander**. The dome opens and shows the flag.

  Press **F12** to open your browser's developer tools. The cookie called `badge` is under **Application** > **Cookies** (in Firefox, **Storage** > **Cookies**). Work out what its value says, change it, then refresh the page.

  **Tools you may need to solve this level:** Your browser's developer tools (F12), CyberChef
