description: |-
  Aldhibah, the dragon, is asleep. Its program will tell you the flag, but only once the dragon wakes in a thousand years, and only if you're the dragon's rider. You aren't.

  You don't have a thousand years, and you can't become the rider. But a debugger can do more than watch a program: it can change what the program does while it runs.

  **Your goal:** make `aldhibah` skip the wait and accept you as its rider, so that it prints the flag.

  gdb may warn that it can't find `aldhibah.c`. That's normal: you have the program, not the code it was written from.

  Log in with the command below and the password `draco`.
