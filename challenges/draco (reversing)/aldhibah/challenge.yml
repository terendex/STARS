hints:
  - content: "In `gdb ./aldhibah`, `info functions` lists the program's functions. `break` pauses at one, and `return` leaves it straight away, skipping whatever it was about to do. `return 1` also makes the function hand back 1, which here means yes."
    cost: 10
  - content: "Type `break wait_for_dragon`, `break is_rider`, then `run`. At the first pause, type `return`, answer `y`, then `continue`. At the second, type `return 1`, answer `y`, then `continue`."
