description: |-
  Aldhibah, the dragon, is hibernating. Its program will tell you the flag, but only once the dragon wakes in a thousand years, and only if you're a rider of high enough rank. You aren't.

  You don't have a thousand years, and you can't change your rank. But a debugger can do more than watch a program: it can change what the program does while it runs.

  **Your goal:** make `aldhibah` skip the wait and accept your rank, so that it prints the flag.

  gdb may warn that it can't find `aldhibah.c`. That's normal: you have the program, not the code it was written from. If you run `./aldhibah` on its own, it just waits. Press Ctrl+C to stop it.

  Log in with the command below and the password `draco`.
connection_info: ssh aldhibah@192.168.68.103 -p 2222
flags:
  - "STARS{4ldh1b4h_r4nk_s3v3n_r1d3r}"
tags:
  - "★★★ Hard"
hints:
  - content: "In `gdb ./aldhibah`, `info functions` lists the program's functions. `break` pauses at one, and `return` leaves it straight away, skipping whatever it was about to do. `return` followed by a number also makes the function hand back that number."
    cost: 10
  - content: "Type `break hibernate`, `run`, then `return`, answer `y`, and `continue`: the dragon wakes and tells you the rank it wants. Run it again with `break rider_rank` as well, and at that pause type `return` followed by that rank, answer `y`, then `continue`."
    cost: 10
state: visible
