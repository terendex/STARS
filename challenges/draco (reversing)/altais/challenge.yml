hints:
  - content: "Start with `gdb ./altais`. `break forget_flag` tells gdb to pause when the program reaches that function, and `run` starts the program."
    cost: 5
  - content: "When gdb pauses at `forget_flag`, type `info args`. It shows what the function was given, which is the flag it's about to wipe. Type `quit` to leave gdb."
