description: |-
  Altais works out its flag and holds it in memory, then wipes it without ever printing it. The flag only exists for a moment while the program runs.

  To see it, you need to pause the program at the right moment and look inside. That's what a **debugger** does, and this server has one called `gdb`. In gdb, `info functions` lists the program's functions, and Altais's have helpful names.

  **Your goal:** stop `altais` before it forgets the flag, and read the flag from its memory.

  gdb may warn that it can't find `altais.c`. That's normal: you have the program, not the code it was written from.

  Log in with the command below and the password `draco`.

  **Commands you may need to solve this level:** `gdb`
