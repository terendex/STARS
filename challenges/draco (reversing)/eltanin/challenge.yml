description: |-
  Eltanin, the eye of the dragon, only opens up for the right password. You give the program your guess after its name, like `./eltanin hello`. It checks your guess against the real password, but it keeps the real one scrambled, so `strings` won't find it.

  You don't need to read the program. Watch it work instead: `ltrace` runs a program and shows every library function it calls, along with what it passes in. To use it, put `ltrace` in front of the command you'd normally type. One of the calls compares two pieces of text.

  **Your goal:** find the password, then give it to `./eltanin`. The program prints the flag.

  Log in with the command below and the password `draco`.

  **Commands you may need to solve this level:** `ltrace`
