description: |-
  The Flame Nebula glows beside Orion's belt, and its star register lets anyone name a star of their own. Type a name, and the site makes you a welcome card with it.

  The site builds the card with **Jinja**, a template engine that works out anything you put between double curly braces, `{{ }}`. Whatever you type becomes part of the template itself, not just text printed on the card, so the site works out your braces too. This is called **server-side template injection** (SSTI).

  The site runs on Flask, and its settings are in a variable the template can see.

  **Your goal:** open the register at the address below and get it to show you the site's secret settings. The flag is one of them.

  **Tools you may need to solve this level:** Jinja template injection with `{{ }}`
