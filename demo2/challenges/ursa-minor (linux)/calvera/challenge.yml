description: |-
  Calvera is a lonely neutron star in the Little Dipper, named after the villain of the film The Magnificent Seven. It gives off no light we can see, so it hides in plain sight.

  When you type a command like `cat`, the shell looks through a list of folders called your **PATH**, in order, and runs the first program with that name. On this account, someone put a folder of look-alike commands at the front of that list. They work like the real ones, except that they hide anything shaped like a flag.

  **Your goal:** read the real contents of `report.txt` in your home folder. The flag is in it.

  Log in with the command below and the password `neutronstar`.

  **Commands you may need to solve this level:** `echo $PATH`, `type`, `cat`
connection_info: ssh calvera@192.168.68.101 -p 2250
