description: |-
  Jabbah is a star system in the head of Scorpius, near the end of its life. Its core monitor asks for a fusion reading, but it lets you type up to 256 bytes into a space that only holds 64. Everything past the first 64 bytes spills into what comes after. This is called a **buffer overflow**. Read the source below.

  Just past that 64-byte space sit 8 bytes of saved data, and then the **return address**: the place the program jumps back to when the current function ends. Overflow far enough to overwrite the return address and you choose where the program goes next. The program has a function called `supernova` that nothing ever calls and that prints the flag, and when it starts it tells you where that function is: `supernova() is at 0x...`.

  So the input you send is **72 bytes of filler** (64 to fill the space, plus 8 for the saved data), then **`supernova`'s address**. The address has to be sent as raw bytes — you can't type those on a keyboard — and written **backwards** (this is called little-endian), padded with zeros to 8 bytes. For the address `0x4017c5`, the 8 bytes are `\xc5\x17\x40\x00\x00\x00\x00\x00`.

  `printf` turns those `\x` codes into raw bytes, and `|` pipes them straight into `nc`, so the whole attack is one line:

  `printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\xc5\x17\x40\x00\x00\x00\x00\x00' | nc jabbah 9001`

  That's 72 `A`s for the filler, then the 8 address bytes.

  **Your goal:** run that command. The program jumps to `supernova`, which prints the flag.

  **How to connect:** the command needs `printf` and `nc`, which the Calvera account on this CTF already has. Log in with `ssh calvera@<address> -p 2250` (use the address from the command below) and the password `neutronstar`, then paste the `printf ... | nc jabbah 9001` line. If you have `nc` on your own computer instead, the command below connects to the same program — keep the same `printf`, but swap `jabbah 9001` for the host and port it shows.

  **Commands you may need to solve this level:** `ssh`, `nc`, `printf`
