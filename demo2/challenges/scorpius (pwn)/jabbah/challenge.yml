description: |-
  Jabbah is a star system in the head of Scorpius, near the end of its life. Its core monitor takes a fusion reading and logs it, but it was never told what to do with a reading that's too big.

  The program has a function called `supernova` that nothing ever calls, and it even tells you where that function is. Overflow the buffer far enough to overwrite the **return address**, the place the program goes back to when a function ends, and send it to `supernova`.

  **Your goal:** make the program run `supernova`, which prints the flag. Read its source below.

  This needs raw bytes, so a normal keyboard won't do. Connect with the command below from PowerShell, or if you don't have `nc`, log in to the Calvera account on this CTF (port 2250, password `neutronstar`) and run `nc jabbah 9001` from there.
