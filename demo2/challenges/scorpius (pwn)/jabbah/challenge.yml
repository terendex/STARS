description: |-
  Jabbah is a star system in the head of Scorpius, near the end of its life. Its core monitor takes a fusion reading and logs it, but it lets you type up to 256 bytes into a space that holds 64, so a long reading spills into whatever comes next. This is called a **buffer overflow**. Read the source below.

  Right after the 64-byte space come 8 bytes of saved data, and then the **return address**: the place the program goes back to when a function ends. The program has a function called `supernova` that nothing ever calls, and it prints where that function is. Send 72 bytes of padding (64 + 8), then `supernova`'s address, and the program goes to `supernova` instead of back where it came from.

  The address has to be sent as raw bytes, in the order this computer stores them: backwards (**little-endian**), and filled up to 8 bytes. You can't type raw bytes on a keyboard, but `printf` can make them, and you can pipe its output into `nc`.

  **Your goal:** make the program run `supernova`, which prints the flag.

  **How to connect:** the easiest way is from the Calvera account on this CTF, which has `printf` and `nc` ready. Log in with `ssh calvera@<address> -p 2250`, using the address from the command below and the password `neutronstar`, then run `nc jabbah 9001`. The command below reaches the same program from your own computer, if you have `nc` there.

  **Commands you may need to solve this level:** `nc`, `printf`
