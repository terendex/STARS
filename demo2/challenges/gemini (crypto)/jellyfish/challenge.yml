description: |-
  The Jellyfish Nebula drifts near Propus, at the feet of Gemini's twins. Its station sent two signals, both encrypted with the same one-time key (download them below). A one-time key can't be broken if it's used once. This one was used twice, and the station later printed the first message in its newsletter (download it below too).

  **Your goal:** use the printed message to recover the key, then decrypt Signal 2. The flag is in it.
