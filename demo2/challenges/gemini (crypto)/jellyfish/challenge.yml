hints:
  - content: "The signals were made with XOR, which undoes itself: if signal = message XOR key, then key = signal XOR message. In CyberChef, paste Signal 1, add From Hex, then XOR with the newsletter's message as the key (choose UTF8)."
    cost: 0
  - content: "Now XOR Signal 2 with that key. A shortcut in one recipe: paste Signal 2, then From Hex, XOR with Signal 1 (choose HEX), and XOR with the newsletter's message (choose UTF8)."
    cost: 0
