description: |-
  The Jellyfish Nebula drifts near Propus, at the feet of Gemini's twins. Its station sent two signals, both encrypted with **XOR** and the same one-time key (download them below). A one-time key can't be broken if it's used once. This one was used twice, and the station later printed the first message in its newsletter (download it below too).

  XOR undoes itself. XOR a signal with its original message and you get the key. XOR a signal with the key and you get its message.

  **Your goal:** XOR Signal 1 with the newsletter's message to get the key, then XOR Signal 2 with the key. The flag is in Signal 2's message.

  **Tools you may need to solve this level:** CyberChef (`From Hex`, `XOR`, `To Hex`)
