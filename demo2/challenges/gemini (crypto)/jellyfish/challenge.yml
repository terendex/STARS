hints:
  - content: "The signals are written in hex, so start with From Hex. To get the key: paste Signal 1, add From Hex, then add XOR and paste the newsletter's last line (the message) as its key, with the key box set to UTF8. Add To Hex at the end, and the output is the key."
    cost: 0
  - content: "Now paste Signal 2 as the input instead, keep From Hex, and set XOR's key to the hex key from the first hint, with the key box set to HEX. Take out To Hex so the output shows as text."
    cost: 0
