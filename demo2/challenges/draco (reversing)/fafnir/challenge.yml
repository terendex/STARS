description: |-
  Fafnir is a star in Draco, named after the dragon of Norse legend. In old stories, a dragon only answers to its true name, and this program is the same. Run `./fafnir` and it refuses you, because you called it by the name on its door.

  A program always knows the name it was started under. You can't rename `fafnir` itself, but you can make a **link** to it: a second name that points at the same program. Start the program through the link, and the program sees the link's name. Your home folder is read-only, so make the link in `/tmp`.

  **Your goal:** find Fafnir's true name, which is written inside the program, then start the program under that name. It prints the flag.

  Log in with the command below and the password `draco`.

  **Commands you may need to solve this level:** `strings` or `ltrace`, `ln`
