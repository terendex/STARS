description: |-
  Fafnir is a star in Draco, named after the dragon of Norse legend. In old stories, a dragon only answers to its true name, and this program is the same. Run `./fafnir` and it refuses you, because you called it by the name on its door.

  **Your goal:** find Fafnir's true name, then start the program under that name. It prints the flag.

  Log in with the command below and the password `draco`.
