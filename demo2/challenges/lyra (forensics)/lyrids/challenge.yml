description: |-
  Every April, the Lyrids meteor shower seems to pour out of Lyra. On the night of the last one, someone at the observatory phoned in a message by typing it on the phone's keypad, and the call was recorded (download it below).

  Each key on a phone's keypad makes its own beep, called a **DTMF tone**. A DTMF decoder listens to a recording and tells you which keys were pressed.

  **Your goal:** decode the tones to find out which keys were pressed. You'll get numbers with `*` between them, and each number is the **decimal ASCII code** of one character of the flag. Turn those numbers back into text to read the flag.

  **Tools you may need to solve this level:** an online DTMF decoder that takes an audio file, CyberChef (`From Decimal`)
files:
  - dist/call.wav
flags:
  - "STARS{lyr1ds_d14l_t0n3s}"
tags:
  - "★★ Medium"
hints:
  - content: "Every flag starts with `STARS{`, so the keys should start with `83*84*65*82*83*123`. If a decoder misses or doubles some keys, try another one. Or open the file in a spectrogram viewer (Audacity has one): each beep shows as two lines, and the DTMF table on Wikipedia says which key each pair of lines means."
    cost: 0
  - content: "In CyberChef, paste the keys and add From Decimal. It expects spaces between the numbers, so change its Delimiter from Space to Auto, which splits the numbers at the `*`s."
    cost: 0
