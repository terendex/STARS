worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Docker's DNS. Looking names up per connection means one stopped challenge
    # can't stop the proxy from starting, and rebuilt challenges are found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    # Keep delivering a program's output after the client has finished sending.
    proxy_half_close on;

    # Linux: shared SSH box (also the SSH route into Pwn)
    server { listen 2240; set $upstream linux-box:22; proxy_pass $upstream; }

    # Reversing: SSH box with the reversing tools
    server { listen 2242; set $upstream rev-box:22; proxy_pass $upstream; }

    # Web
    server { listen 8301; set $upstream view-source:8000; proxy_pass $upstream; }
    server { listen 8302; set $upstream robots-only:8000; proxy_pass $upstream; }
    server { listen 8303; set $upstream client-lock:8000; proxy_pass $upstream; }
    server { listen 8304; set $upstream greyed-out:8000; proxy_pass $upstream; }
    server { listen 8305; set $upstream saved-for-later:8000; proxy_pass $upstream; }
    server { listen 8306; set $upstream header-hunt:8000; proxy_pass $upstream; }
    server { listen 8307; set $upstream blink:8000; proxy_pass $upstream; }
    server { listen 8308; set $upstream next-order:8000; proxy_pass $upstream; }
    server { listen 8309; set $upstream cookie-jar:8000; proxy_pass $upstream; }
    server { listen 8310; set $upstream secret-agent:8000; proxy_pass $upstream; }
    server { listen 8311; set $upstream up-a-folder:8000; proxy_pass $upstream; }
    server { listen 8312; set $upstream sign-in-anyway:8000; proxy_pass $upstream; }
    server { listen 8313; set $upstream badge-swap:8000; proxy_pass $upstream; }
    server { listen 8314; set $upstream the-union:8000; proxy_pass $upstream; }
    server { listen 8315; set $upstream filter-dodge:8000; proxy_pass $upstream; }

    # Pwn
    server { listen 9041; set $upstream shaula:9001; proxy_pass $upstream; }
    server { listen 9042; set $upstream sargas:9001; proxy_pass $upstream; }
    server { listen 9043; set $upstream lesath:9001; proxy_pass $upstream; }
    server { listen 9044; set $upstream fang:9001; proxy_pass $upstream; }
    server { listen 9045; set $upstream larawag:9001; proxy_pass $upstream; }
    server { listen 9046; set $upstream dschubba:9001; proxy_pass $upstream; }
    server { listen 9047; set $upstream acrab:9001; proxy_pass $upstream; }
    server { listen 9048; set $upstream antares:9001; proxy_pass $upstream; }
}
