description: |-
  The gym's sauna is only for **gold** members, and you're a basic one. The site decides your membership by reading a cookie, a small note the website stores in your browser, and you can edit your own cookies.

  **Your goal:** open the site at the address below and make it believe your membership is **gold**. The sauna opens and shows the flag.

  Press **F12** to open your browser's developer tools. The cookie called `membership` is under **Application** > **Cookies** (in Firefox, **Storage** > **Cookies**). Work out what its value says, change it, then refresh the page.

  **Tools you may need to solve this level:** Your browser's developer tools (F12), [CyberChef](https://gchq.github.io/CyberChef/)
