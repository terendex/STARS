description: |-
  The Pizza Club's members' area asks for a members' code. But the code isn't checked by the website's server: it's checked by a script inside the page itself. Everything inside a page has been sent to your browser, so you can read it.

  **Your goal:** find the members' code in the page's code, type it in, and get into the members' area. The flag is there.

  **Tools you may need to solve this level:** View page source (Ctrl+U)
