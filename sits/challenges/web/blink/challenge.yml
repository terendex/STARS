description: |-
  The library's lost and found page holds the flag, but the instant it loads, it sends your browser somewhere else. That's called a **redirect**, and it happens so fast you never see the first page. Even pressing Ctrl+U shows you the code of the page you ended up on, not the one you wanted.

  The trick is to read the first page without letting your browser follow the redirect.

  **Your goal:** read the page at the address below before your browser leaves it. The flag is on that page.

  **Tools you may need to solve this level:** View page source, your browser's developer tools (F12), or `curl.exe` in PowerShell
connection_info: http://192.168.8.109:8307
