  - "FLAG{r3d1r3ct_t00_f4st}"
tags:
  - "★★ Medium"
hints:
  - content: "If you type `view-source:` in front of an address in the address bar, the browser shows that page's code without running it, so nothing redirects you. Type the address yourself rather than pressing Ctrl+U."
    cost: 5
  - content: "Another way: in PowerShell, `curl.exe` followed by the address prints the page's code and doesn't follow this kind of redirect."
    cost: 5
state: visible
