description: |-
  When a website sends you a page, it also sends a few lines of information about the page that your browser reads but never shows. These are called **response headers**. They say things like what kind of file it is and when it was sent, but a website can add any header it likes.

  **Your goal:** read the headers the weather site at the address below sends with its page. One of them is the flag.

  **Tools you may need to solve this level:** Your browser's developer tools (F12), or `curl.exe` in PowerShell
