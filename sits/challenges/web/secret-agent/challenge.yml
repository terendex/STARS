description: |-
  Every time your browser asks a website for a page, it introduces itself in a line called the **User-Agent**. The spy shop reads that line and only opens for the agency's own browser, which introduces itself as `SecretAgent/007`.

  You can't install that browser, but nothing stops your requests from introducing themselves however you like.

  **Your goal:** open the shop at the address below while introducing yourself as `SecretAgent/007`. The gadget catalogue opens and shows the flag.

  **Tools you may need to solve this level:** Your browser's developer tools (F12), or `curl.exe` in PowerShell
connection_info: http://192.168.68.104:8310
