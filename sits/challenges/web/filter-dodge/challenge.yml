attempts: 3
description: |-
  The Travel Diary loads each day's page from a folder called `pages`, using the name in the address: `?page=day1.txt`. The flag is in `flag.txt`, one folder **above** `pages`, just like in Up a Folder.

  This time there's a **safety filter**: before opening anything, the site deletes every `../` from the name you give it. The page shows you what you asked for and what's left after the filter, so you can watch it work. But it only runs once.

  **Your goal:** get past the filter and open `flag.txt`.
connection_info: http://192.168.68.104:8315
flags:
  - "FLAG{f1lt3r_d0dg3d_w1th_d0ts}"
tags:
  - "★★★ Hard"
hints:
  - content: "Try `?page=../flag.txt` and look at \"After the safety filter\": the `../` is gone. The filter doesn't check again after deleting, so think about a name that *turns into* `../` once a `../` is cut out of the middle of it."
    cost: 10
  - content: "Use `?page=....//flag.txt`. The filter cuts the `../` out of the middle of `....//`, and what's left is `../`."
    cost: 20
state: visible
