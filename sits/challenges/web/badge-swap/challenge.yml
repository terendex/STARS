hints:
  - content: "The value is Base64. [CyberChef](https://gchq.github.io/CyberChef/)'s **From Base64** shows JSON: names and values in quotes, inside curly brackets. Change `standing` to `vip` and `false` to `true`, keeping every quote and bracket, then use **To Base64** and paste the result in as the cookie's value."
    cost: 10
  - content: "The JSON to encode is `{\"name\": \"guest\", \"seat\": \"vip\", \"backstage\": true}`. **To Base64** turns it into `eyJuYW1lIjogImd1ZXN0IiwgInNlYXQiOiAidmlwIiwgImJhY2tzdGFnZSI6IHRydWV9`. Paste that as the cookie's value, press Enter, and refresh the page."
    cost: 20
