description: |-
  The festival's backstage area is only for tickets with a **vip** seat **and** backstage access. Yours has neither. The site reads your ticket from a cookie, and you can edit your own cookies, but this time the cookie holds more than one thing, and two of them have to change.

  **Your goal:** open the festival site at the address below and change your ticket so the site lets you backstage. The flag is there.

  The cookie is called `ticket`. It's under **Application** > **Cookies** in developer tools (F12), or **Storage** > **Cookies** in Firefox. Its value is encoded, and the page shows what it reads from it, so you can check your work.
connection_info: http://192.168.68.101:8313
