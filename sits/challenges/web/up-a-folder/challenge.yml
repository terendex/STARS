description: |-
  The Recipe Box loads each recipe from a file in a folder called `recipes`, and the address says which file to open: `?recipe=pancakes.txt`. The site opens whatever name you give it, without checking where that file is.

  The flag is in a file called `flag.txt`, which is kept **one folder above** `recipes`. Reaching outside the folder you're meant to stay in is called **path traversal**.

  **Your goal:** change the address so the site opens `flag.txt` instead of a recipe.

  **Tools you may need to solve this level:** Your browser's address bar
