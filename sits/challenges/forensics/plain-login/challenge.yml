version: "0.1"
name: "Plain Login"
author: "Axel Jonas C. Tangalin"
attribution: "Made by Axel Jonas C. Tangalin"
category: "Forensics"
type: standard
value: 60
# Dynamic scoring: starts at 60, then every solve takes 3 off for
# everyone who has solved it, down to 30.
extra:
  function: linear
  initial: 60
  decay: 3
  minimum: 30
attempts: 3
description: |-
  This is a recording of network traffic in an office, captured while someone logged in to the intranet over plain, unencrypted HTTP. Anything sent that way can be read by anyone watching the network, passwords included.

  **Your goal:** find the password that got them in. That password is the flag.

  Download the recording, `login_capture.pcap`, below and open it in [Wireshark](https://www.wireshark.org/), a free tool for inspecting network traffic.

  **Tools you may need to solve this level:** Wireshark
files:
  - dist/login_capture.pcap
flags:
  - "FLAG{b4s1c_4uth_1s_just_b4s364}"
tags:
  - "★★ Medium"
hints:
  - content: "In Wireshark, type `http` in the filter bar and press Enter. Look for the two `GET /admin` requests: the first got `401 Unauthorized`, so that password was wrong."
    cost: 5
  - content: "Click the second `GET /admin` request and open **Hypertext Transfer Protocol** in the panel below. The `Authorization: Basic` line holds `username:password` in Base64, and Wireshark decodes it for you on the **Credentials** line under it."
    cost: 10
state: visible
