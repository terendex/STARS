version: "0.1"
name: "Needle in the Logs"
author: "Axel Jonas C. Tangalin"
attribution: "Made by Axel Jonas C. Tangalin"
category: "Linux"
type: standard
value: 60
# Dynamic scoring: starts at 60, then every solve takes 3 off for
# everyone who has solved it, down to 30.
extra:
  function: linear
  initial: 60
  decay: 3
  minimum: 30
attempts: 3
description: |-
  `logins.log` records 25,000 logins, and every line has a token that looks like a flag. The real flag is the token on the one line where the user **principal** was **DENIED**.

  **Your goal:** find that line and read its token.

  Log in with the command below and the password `haystack`.

  **Commands you may need to solve this level:** `grep`
connection_info: ssh needle@192.168.68.101 -p 2240
flags:
  - "FLAG{tw0_gr3ps_1n_4_r0w}"
tags:
  - "★★ Medium"
hints:
  - content: "`grep word file` prints only the lines containing that word. `grep FLAG` matches every line here, so search for what makes the right line special instead."
    cost: 5
  - content: "Chain two searches with `|`: `grep user=principal logins.log | grep DENIED`."
    cost: 10
state: visible
