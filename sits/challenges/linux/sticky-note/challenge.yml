description: |-
  This time the note isn't in a file. When you log in, the server gives your session a list of named settings called **environment variables**, and every program you run can read them. Someone stuck the flag on as one of them.

  **Your goal:** find the environment variable that holds the flag. Read `notes.txt` too.

  Log in with the command below and the password `postit`.

  **Commands you may need to solve this level:** `env`, `grep`
connection_info: ssh sticky@192.168.68.103 -p 2240
