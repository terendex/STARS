version: "0.1"
name: "Exact Size"
author: "Axel Jonas C. Tangalin"
attribution: "Made by Axel Jonas C. Tangalin"
category: "Linux"
type: standard
value: 60
# Dynamic scoring: starts at 60, then every solve takes 3 off for
# everyone who has solved it, down to 30.
extra:
  function: linear
  initial: 60
  decay: 3
  minimum: 30
attempts: 3
description: |-
  The `warehouse` folder holds 1,000 parcels on 10 shelves, and every parcel has a line that looks like a flag. Only one is real: the parcel that is **exactly 1234 bytes** and **owned by the user `courier`**.

  **Your goal:** find that parcel and read the flag inside it.

  Log in with the command below and the password `measuring`.

  **Commands you may need to solve this level:** `find`, `grep`
connection_info: ssh exactsize@192.168.8.109 -p 2240
flags:
  - "FLAG{s1z3d_4nd_s1gn3d_f0r}"
tags:
  - "★★ Medium"
hints:
  - content: "`find` can filter files by size and by owner. `-size 1234c` means exactly 1234 bytes (`c` stands for bytes), and `-user courier` means owned by courier."
    cost: 5
  - content: "`find ~/warehouse -type f -size 1234c -user courier` prints the one parcel. Then `grep flag:` followed by that path prints its flag line."
    cost: 10
state: visible
