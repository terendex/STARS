description: |-
  Start here if you've never used a terminal before. A lot of hacking happens on servers you control by typing commands, and this is your first one.

  **Your goal:** log in to the server and read the flag in your home folder. Every flag in this competition looks like `FLAG{...}`.

  **How to do it:**

  1. Open a terminal. On Windows, that's PowerShell: press the Windows key, type `powershell` and press Enter.
  2. Type the command below and press Enter.
  3. If it asks whether you want to continue connecting, type `yes` and press Enter.
  4. Enter the password `doormat`. Nothing appears as you type it, which is normal.
  5. Type `ls` and press Enter. It lists the files in your home folder.
  6. Type `cat hello.txt` and press Enter to read the file.

  **Then:** copy the flag into the box below. To copy from PowerShell, highlight the text with the mouse, then right-click. Type `exit` to leave the server.

  **Commands you may need to solve this level:** `ssh`, `ls`, `cat`
