hints:
  - content: "`nc -z` checks whether a port is open without sending anything, and it takes a range like `5000-5999`. Add `-v` to see a result for each port."
    cost: 5
  - content: "`nc -zv doorbell 5000-5999 2>&1 | grep succeeded` prints only the open port. Then connect with `nc doorbell` followed by that port number."
    cost: 10
