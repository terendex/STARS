description: |-
  There's a doorbell server called `doorbell` on this competition's private network. Your own computer can't reach it, but the Linux box can. It answers on **one port** between **5000 and 5999**, and sends the flag to whoever connects to it. Checking a range of ports to see which are open is called a **port scan**.

  **Your goal:** find the open port on `doorbell`, connect to it, and read the flag. When it has printed, press **Ctrl+C** to get back to the prompt.

  Log in with the command below and the password `whosthere`.

  **Commands you may need to solve this level:** `nc`, `grep`
connection_info: ssh knock@192.168.8.109 -p 2240
