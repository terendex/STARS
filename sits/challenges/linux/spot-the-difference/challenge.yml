version: "0.1"
name: "Spot the Difference"
author: "Axel Jonas C. Tangalin"
attribution: "Made by Axel Jonas C. Tangalin"
category: "Linux"
type: standard
value: 30
# Dynamic scoring: starts at 30, then every solve takes 1 off for
# everyone who has solved it, down to 15.
extra:
  function: linear
  initial: 30
  decay: 1
  minimum: 15
attempts: 3
description: |-
  There are two copies of the party guest list: `guests-monday.txt` and `guests-friday.txt`. Each has 3,000 lines, and every line has a ticket that looks like a flag. Between Monday and Friday, **exactly one line changed**, and its new ticket is the real flag.

  **Your goal:** find the line that's different in `guests-friday.txt`. Comparing 3,000 lines by eye would take forever.

  Log in with the command below and the password `twinphotos`.

  **Commands you may need to solve this level:** `diff`
connection_info: ssh spotdiff@192.168.68.104 -p 2240
flags:
  - "FLAG{0n3_l1n3_ch4ng3d}"
tags:
  - "★ Easy"
hints:
  - content: "`diff first second` compares two files and prints only the lines that are different."
    cost: 5
  - content: "In `diff`'s output, lines starting with `<` come from the first file and lines starting with `>` from the second. The flag is on the `>` line."
    cost: 5
state: visible
