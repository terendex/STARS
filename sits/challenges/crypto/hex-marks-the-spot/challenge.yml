description: |-
  The treasure map is written in **hexadecimal**. Computers store each letter as a number, and hex is a way of writing those numbers with the digits `0` to `9` and the letters `a` to `f`. Each pair is one character: `46` means `F`, and `4c` means `L`.

  **Your goal:** turn the numbers in `map.txt` (download it below) back into text to read the flag. Use CyberChef the same way as in Not So Secret: paste the file into **Input**, then find the operation that reads hex.

  **Tools you may need to solve this level:** [CyberChef](https://gchq.github.io/CyberChef/)
