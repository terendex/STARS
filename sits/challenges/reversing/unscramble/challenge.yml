tags:
  - "★★ Medium"
hints:
  - content: "To undo a process, undo its steps in the opposite order, like taking off shoes and socks. Base64 was the last step, so undo it first, and undo the reversing last."
    cost: 5
  - content: "In CyberChef, paste the scrambled password and use **From Base64**, then **ROT13** with **Amount** set to `23` (moving 23 letters forward is the same as 3 back), then **Reverse**."
    cost: 10
state: visible
