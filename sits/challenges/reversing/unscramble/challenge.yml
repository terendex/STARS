description: |-
  The ice cream shop's secret menu, `unscramble.py`, scrambles the password you type in three steps, then compares the result with a scrambled copy of the real password that it keeps. You can't make it unscramble that copy for you, but you can read exactly how the scrambling works.

  **Your goal:** undo the scrambling to get the password back, then run `python3 unscramble.py` and type it in. The program prints the flag.

  Log in with the command below and the password `reverse`.

  **Tools you may need to solve this level:** `cat`, [CyberChef](https://gchq.github.io/CyberChef/)
connection_info: ssh unscramble@192.168.68.104 -p 2242
