description: |-
  The program `checker` wants a password, which you give it after its name, like `./checker hello`. It keeps the real password scrambled, so `strings` won't find it.

  You don't need to read the program. Watch it work instead: `ltrace` runs a program and shows every library function it calls, along with what it passes in. Put `ltrace` in front of the command you'd normally type. One of the calls compares two pieces of text.

  **Your goal:** find the password, then give it to `./checker`. The program prints the flag.

  Log in with the command below and the password `reverse`.

  **Commands you may need to solve this level:** `ltrace`
