  - "FLAG{ch4r_c0d3s_t0_l3tt3rs}"
tags:
  - "★ Easy"
hints:
  - content: "In `python3`, `chr(97)` gives `'a'`. The program builds the password itself on the line starting `password =`. Paste that line's right-hand side into `python3`, with `CODES` swapped for the list of numbers from the file, square brackets included."
    cost: 5
  - content: "Or in CyberChef: paste just the numbers into Input, add **From Decimal**, and set its **Delimiter** to `Comma`."
    cost: 5
state: visible
