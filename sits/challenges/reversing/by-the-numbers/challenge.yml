description: |-
  The cinema's staff door, `numbers.py`, keeps its password as numbers instead of letters. Computers store every letter as a number called its **character code**: `A` is 65, `B` is 66, and lowercase `a` is 97.

  **Your goal:** turn the numbers back into the password, then run `python3 numbers.py` and type it in. The program prints the flag.

  Log in with the command below and the password `reverse`.

  **Tools you may need to solve this level:** `cat`, `python3`, [CyberChef](https://gchq.github.io/CyberChef/)
connection_info: ssh numbers@192.168.68.104 -p 2242
