  - "★★★ Hard"
hints:
  - content: "In `gdb ./vip`, `info functions` lists the program's functions. `break` pauses at one, and `return` leaves it straight away. `return` followed by a number also makes the function hand back that number."
    cost: 10
  - content: "Type `break queue_up`, `run`, then `return`, answer `y`, and `continue`: the bouncer tells you the tier it wants. Then type `break vip_tier` and `run` again, skip the queue the same way (`return`, `y`, `continue`), and at the `vip_tier` pause type `return` followed by that tier, answer `y`, then `continue`."
    cost: 10
state: visible
