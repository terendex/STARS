description: |-
  The club has a thousand-year queue, and after that, the bouncer only lets in VIPs of a high enough tier. You aren't one.

  You can't change who you are, but a debugger can change what a program does while it runs.

  **Your goal:** get past both the wait and the bouncer, so the program `vip` prints the flag.

  If you run `./vip` on its own, it just waits. Press Ctrl+C to stop it. gdb may warn that it can't find `vip.c`. That's normal: you have the program, not the code it was written from.

  Log in with the command below and the password `reverse`.
connection_info: ssh tworeturns@192.168.68.104 -p 2242
