tags:
  - "★ Easy"
hints:
  - content: "A line like `if guess[3] != \"k\"` means \"the letter at position 3 must be k\". `len(guess) != 10` means the password has 10 letters. Write the positions 0 to 9 in a row and fill in each letter under its number."
    cost: 5
