description: |-
  The gym locker, `letters.py`, never writes its password down. It checks your guess one letter at a time, in a jumbled order, so the password doesn't read straight off the screen.

  In Python, `guess[0]` means the first letter of `guess`, `guess[1]` the second, and so on: Python counts positions from 0, not 1.

  **Your goal:** work out the password from the checks, then run `python3 letters.py` and type it in. The program prints the flag.

  Log in with the command below and the password `reverse`.

  **Commands you may need to solve this level:** `cat`, `python3`
connection_info: ssh letters@192.168.8.109 -p 2242
flags:
