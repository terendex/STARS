description: |-
  The program `notes` writes a secret note in memory, then burns it without ever printing it. The note is the flag, and it only exists for a moment.

  To see it, you need to pause the program at the right moment and look inside. That's what a **debugger** does, and this server has one called `gdb`. In gdb, `info functions` lists the program's functions, and these have helpful names.

  **Your goal:** stop `notes` before it burns the note, and read the flag from its memory.

  gdb may warn that it can't find `notes.c`. That's normal: you have the program, not the code it was written from.

  Log in with the command below and the password `reverse`.

  **Commands you may need to solve this level:** `gdb`
connection_info: ssh freeze@192.168.8.109 -p 2242
flags:
  - "FLAG{c4ught_b3f0r3_th3_burn}"
tags:
  - "★★ Medium"
hints:
  - content: "Start with `gdb ./notes`. `break burn_note` tells gdb to pause when the program reaches that function, and `run` starts the program."
    cost: 5
  - content: "When it pauses at `burn_note`, type `info args`: it shows what the function was given, which is the note it's about to burn. Type `quit` to leave gdb."
    cost: 5
state: visible
