hints:
  - content: "Start with `gdb ./vault`, then `disassemble check_code`. The instruction that compares two values is `cmp`, and numbers written into an instruction start with `$`."
    cost: 5
  - content: "The number after `$` on the `cmp` line is the code. Type `quit`, run `./vault`, and type the number with its `0x` but without the `$`."
    cost: 10
