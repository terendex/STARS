description: |-
  The piggy bank `vault` asks for a code, a number. The number isn't stored as text anywhere, so `strings` won't find it: it's written straight into the program's instructions.

  A debugger can show those instructions. In `gdb`, `info functions` lists the program's functions, and `disassemble` followed by a function's name shows it as **assembly**: the small, simple steps the processor actually runs, one per line.

  **Your goal:** find the code in the vault's instructions, then run `./vault` and type it in. The program prints the flag.

  The vault understands numbers written in hexadecimal (starting with `0x`, like `0x1f`) as well as ordinary ones, so you don't need to convert anything.

  Log in with the command below and the password `reverse`.

  **Commands you may need to solve this level:** `gdb`
connection_info: ssh assembly@192.168.68.104 -p 2242
