hints:
  - content: "Run `ltrace ./pantry`. `getenv` is short for get environment variable: the text in its brackets is the name the pantry asks for, and `nil` means it isn't set."
    cost: 5
  - content: "Set that variable to anything by putting it in front, like `NAME=hello ltrace ./pantry` with the real name. Now find the `strcmp` line: its second text is the value it wants."
    cost: 5
