description: |-
  The arcade's high-score table, `mixedup.py`, also scrambles the password you type in three steps, but different ones, then compares the result with its scrambled copy of the real password.

  **Your goal:** undo the scrambling to get the password back, then run `python3 mixedup.py` and type it in. The program prints the flag.

  Log in with the command below and the password `reverse`.

  **Tools you may need to solve this level:** `cat`, [CyberChef](https://gchq.github.io/CyberChef/)
