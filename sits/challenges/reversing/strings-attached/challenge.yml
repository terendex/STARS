description: |-
  Start here if you've never done reverse engineering. Reversing means working out what a program does, and what it's hiding, without seeing the code it was written from.

  **Your goal:** find the flag hidden inside the program `secret`. Running it won't show you the flag.

  **How to do it:**

  1. Open a terminal (on Windows, that's PowerShell), type the command below and press Enter. If it asks whether to continue connecting, type `yes`. Then enter the password `reverse`. Nothing appears as you type it, which is normal.
  2. Type `ls` to see the program, and `./secret` to run it.
  3. Programs carry their text inside them. `strings secret` lists every piece of readable text in the program.
  4. That's a lot of lines. `strings secret | grep FLAG` shows only the lines containing `FLAG`.

  **Then:** paste the flag into the box below. Type `exit` to leave.

  **Commands you may need to solve this level:** `ssh`, `ls`, `strings`, `grep`
connection_info: ssh strings@192.168.68.101 -p 2242
