description: |-
  The `queue` program puts you in line for a new phone, and the wait is a thousand years. Only after that does it print your receipt, which has the flag.

  A debugger can make a function stop early. When gdb has paused inside a function, `return` leaves it straight away, skipping the rest of it.

  **Your goal:** skip the wait, so the program prints the flag.

  If you run `./queue` on its own, it just waits. Press Ctrl+C to stop it. gdb may warn that it can't find `queue.c`. That's normal: you have the program, not the code it was written from.

  Log in with the command below and the password `reverse`.

  **Commands you may need to solve this level:** `gdb`
connection_info: ssh skipwait@192.168.68.104 -p 2242
