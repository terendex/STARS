hints:
  - content: "Look at `struct record` in the source. Add up the size of every field before `key` to work out how many characters to type first. A `char` is 1 byte and an `unsigned int` is 4 bytes."
    cost: 5
  - content: "The fields before `key` are `name` (32 bytes) and `visits` (4 bytes), so type 36 characters first. The key must read `0x41564f4e`: that's four bytes, `41`='A', `56`='V', `4f`='O', `4e`='N'. The computer stores the lowest byte first, so you type them in reverse. After 36 characters, type `NOVA`."
    cost: 10
