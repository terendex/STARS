description: |-
  This is a buffer overflow again, like Name Tag, but it has to be exact now. Your name can spill into an access key, and the key has to end up holding one specific number. The source code shows which number.

  The program prints what ended up in the key, in hexadecimal, so you can see how close you are.

  **Your goal:** make the key hold exactly the right number. The program prints the flag when it does.

  **How to connect:** Windows doesn't come with `nc`, so open a terminal (PowerShell) and run the command below. It uses the password `pwnit` and takes you straight into the program, with no shell. On a Mac or Linux, or if you have `nc` installed, `nc IP 9046` works the same way.

  The program's source code is attached below as a download. Reading it is how you find the weakness.

  **Commands you may need to solve this level:** `ssh`, `nc`, `cat`
connection_info: ssh exactfit@192.168.68.101 -p 2240
