description: |-
  The program repeats your message back to you. In C, `printf` treats codes like `%p` and `%s` as instructions to read data from memory, and this program passes your message straight to it. This is called a **format string** bug.

  **Your goal:** the flag is sitting in the program's memory, but the program never prints it on its own. Use the bug to read it out.

  **How to connect:** Windows doesn't come with `nc`, so open a terminal (PowerShell) and run the command below. It uses the password `pwnit` and takes you straight into the program, with no shell. On a Mac or Linux, or if you have `nc` installed, `nc IP 9047` works the same way.

  The program's source code is attached below as a download. Reading it is how you find the weakness.

  **Commands you may need to solve this level:** `ssh`, `nc`
connection_info: ssh echoecho@192.168.8.109 -p 2240
