hints:
  - content: "Type `%p %p %p %p` as your message and you'll see values from memory instead of your text. That's the bug working."
    cost: 5
  - content: "`%7$s` means \"take the 7th value and print whatever text it points to\". Try the numbers going up: `%1$s`, `%2$s`, and so on. The flag's pointer is well down the list, past `%25$s`. A blank line or a disconnect just means that value wasn't a text pointer, so reconnect and try the next number."
    cost: 10
state: visible
