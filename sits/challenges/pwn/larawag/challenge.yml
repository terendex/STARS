description: |-
  The greeter asks for a name, puts it into a terminal command, and runs that command. The source code is attached below. A terminal can run more than one command from a single line.

  **Your goal:** make the program show you the file `/flag.txt`.

  **How to connect:** Windows doesn't come with `nc`, so open a terminal (PowerShell) and run the command below. It uses the password `pwnit` and takes you straight into the program, with no shell. On a Mac or Linux, or if you have `nc` installed, `nc IP 9045` works the same way.

  The program's source code is attached below as a download. Reading it is how you find the weakness.

  **Commands you may need to solve this level:** `ssh`, `nc`, `cat`
connection_info: ssh greeter@192.168.68.104 -p 2240
files:
  - dist/larawag.c
