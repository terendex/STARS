  - "FLAG{s3m1c0l0n_s4ys_h3ll0}"
tags:
  - "★ Easy"
hints:
  - content: "In a terminal, `;` ends one command and starts the next, so `echo hi; ls` runs both. Put that idea into the name you give the greeter."
    cost: 5
  - content: "Enter the name `; cat /flag.txt`. The greeter runs `echo Hello,` then your `cat /flag.txt`."
    cost: 10
state: visible
