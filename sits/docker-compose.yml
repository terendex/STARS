name: sits

# SITS Capture The Flag Competition 2026, by Axel Jonas C. Tangalin.
# Its own CTF beside STARS (2nd Star, Classic and the demo): its own CTFd,
# accounts and scores, with the same mission clock, music, first blood, help
# queue and dynamic scoring (it mounts the same ctfd-plugin). Use
# scripts\sits.ps1 to set it up, start it and stop it. It uses the real CTF's IP
# address and these ports:
#   8300 CTFd   2240 Linux SSH box   2242 Reversing SSH box
#   8301-8315 Web   9041-9048 Pwn

# Shared limits for anything players can touch.
x-challenge: &challenge
  # Never restarts by itself, so SITS doesn't start when Docker Desktop does.
  # If something stops during the event, docker compose up -d brings it back.
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [challenges]
  cpus: 1.0
  mem_limit: 256m
  pids_limit: 128

# The web challenges share one image and differ only in which app they run.
x-web: &web
  <<: *challenge
  build: "./challenges/web/web-box"
  tmpfs:
    - /tmp

# The SSH boxes: players log in and use the shell.
x-box: &box
  <<: *challenge
  # Without AUDIT_WRITE, sshd crashes on any login that has a terminal.
  cap_add: [CHOWN, SETGID, SETUID, SYS_CHROOT, KILL, AUDIT_WRITE]
  cpus: 2.0
  pids_limit: 1024
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    - /run:size=1m,mode=755
    # Docker leaves these writable by default, even on a read-only container.
    - /dev/shm:ro,size=4k
    - /dev/mqueue:ro,size=4k

services:
  # --- Scoreboard ---------------------------------------------------------
  ctfd:
    image: ctfd/ctfd:3.8.9
    restart: "no"
    ports:
      - "${CTF_BIND_IP}:8300:8000"
      # The projector's clock page, for this PC only. Spotify only plays whole
      # songs on a secure page, and browsers count http://localhost as secure.
      - "127.0.0.1:8003:8000"
    environment:
      STARS_PROJECTOR_URL: http://localhost:8003/timer
      UPLOAD_FOLDER: /var/uploads
      DATABASE_URL: mysql+pymysql://ctfd:${DB_PASSWORD}@db/ctfd
      REDIS_URL: redis://cache:6379
      SECRET_KEY: ${SECRET_KEY}
      WORKERS: 1
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      # Its own login cookie, so signing in here doesn't sign you out of STARS
      # (browsers share cookies between ports).
      STARS_SESSION_COOKIE: sits_session
    volumes:
      - ctfd_logs:/var/log/CTFd
      - ctfd_uploads:/var/uploads
      # STARS's plugin: optional emails, the mission clock, music, first blood
      # and the help queue.
      - ../ctfd-plugin:/opt/CTFd/CTFd/plugins/stars:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on: [db, cache]
    networks: [ctfd_public, ctfd_internal]

  db:
    image: mariadb:10.11
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ctfd
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
    networks: [ctfd_internal]

  cache:
    image: redis:4
    restart: "no"
    volumes:
      - cache_data:/data
    networks: [ctfd_internal]

  # --- Challenge entry point ----------------------------------------------
  # Challenges sit on an internal network with no route out, and Docker can't
  # publish ports from one, so this proxy is what players actually connect to.
  edge:
    <<: *challenge
    image: nginx:stable
    cap_add: [CHOWN, SETGID, SETUID]
    tmpfs:
      - /tmp
      - /var/cache/nginx
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${CTF_BIND_IP}:2240:2240"
      - "${CTF_BIND_IP}:2242:2242"
      - "${CTF_BIND_IP}:8301-8315:8301-8315"
      - "${CTF_BIND_IP}:9041-9048:9041-9048"
    networks: [edge_public, challenges]

  # --- Linux: shared SSH box, also the SSH route into Pwn ------------------
  linux-box:
    <<: *box
    build: "./challenges/linux/linux-box"
    mem_limit: 1g

  # Knock Knock's doorbell: only reachable from the Linux box.
  doorbell:
    <<: *challenge
    build: "./challenges/linux/doorbell"

  # --- Reversing: SSH box with strings, ltrace, gdb and python3 -------------
  rev-box:
    <<: *box
    build: "./challenges/reversing/rev-box"
    # gdb takes far more memory than the shell tools on the Linux box.
    mem_limit: 2g

  # --- Web -----------------------------------------------------------------
  view-source:
    <<: *web
    command: ["view_source:app"]

  robots-only:
    <<: *web
    command: ["robots_only:app"]

  client-lock:
    <<: *web
    command: ["client_lock:app"]

  greyed-out:
    <<: *web
    command: ["greyed_out:app"]

  saved-for-later:
    <<: *web
    command: ["saved_for_later:app"]

  header-hunt:
    <<: *web
    command: ["header_hunt:app"]

  blink:
    <<: *web
    command: ["blink:app"]

  next-order:
    <<: *web
    command: ["next_order:app"]

  cookie-jar:
    <<: *web
    command: ["cookie_jar:app"]

  secret-agent:
    <<: *web
    command: ["secret_agent:app"]

  up-a-folder:
    <<: *web
    command: ["up_a_folder:app"]

  sign-in-anyway:
    <<: *web
    command: ["sign_in_anyway:app"]

  badge-swap:
    <<: *web
    command: ["badge_swap:app"]

  the-union:
    <<: *web
    command: ["the_union:app"]

  filter-dodge:
    <<: *web
    command: ["filter_dodge:app"]

  # --- Pwn ------------------------------------------------------------------
  # One Dockerfile, but each image only contains its own program's flag.
  shaula:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: shaula}

  sargas:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: sargas}

  lesath:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: lesath}

  fang:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: fang}

  larawag:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: larawag}

  dschubba:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: dschubba}

  acrab:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: acrab}

  antares:
    <<: *challenge
    build:
      context: "./challenges/pwn"
      target: service
      args: {STAR: antares}

  # --- Tools --------------------------------------------------------------
  # Mounts the whole STARS folder so the shared scripts are available, but
  # runs from sits/, where SITS's .ctf/config lives.
  ctfcli:
    build: ../tools/ctfcli
    profiles: [tools]
    volumes:
      - ..:/work
    working_dir: /work/sits
    networks: [ctfd_internal]

volumes:
  ctfd_logs:
  ctfd_uploads:
  db_data:
  cache_data:

networks:
  ctfd_public:
  ctfd_internal:
    internal: true
  edge_public:
  challenges:
    internal: true
