<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ctf_name or "STARS" }} clock</title>
  <link rel="stylesheet" href="{{ assets }}clock.css">
</head>
<body class="idle">
  <header class="top">
    <span class="name">{{ ctf_name or "STARS" }}</span>
    <button type="button" class="ghost" id="fullscreen" title="Full screen (F)">Full screen</button>
  </header>

  <div class="blood" id="blood" hidden>
    <div class="blood-label">First blood</div>
    <div class="blood-team" id="blood-team"></div>
    <div class="blood-what" id="blood-what"></div>
  </div>

  <main class="clock">
    <div class="label" id="label">Connecting</div>
    <div class="time" id="time">--:--:--</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="note" id="note"></div>
  </main>

  <aside class="music" id="music" hidden>
    <div class="music-row">
      <span class="music-title" id="music-title">Plays while the clock runs</span>
      <button type="button" class="ghost" id="skip" title="Next track (N)">Skip</button>
    </div>
    <div class="music-embed"><div id="spotify"></div></div>
    <button type="button" class="ghost play" id="music-play" hidden>Play</button>
  </aside>

  <div class="arm" id="arm" hidden>Click anywhere to turn on the sound.</div>

  <script>window.STARS_ASSETS = {{ assets | tojson }};</script>
  <script src="{{ assets }}music.js"></script>
  <script src="{{ assets }}clock.js"></script>
</body>
</html>
