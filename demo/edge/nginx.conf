worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Docker's DNS, looked up per connection. See edge/nginx.conf in the real CTF.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_half_close on;

    # Ursa Minor: SSH box
    server { listen 2221; set $upstream ssh-box:22; proxy_pass $upstream; }

    # Draco: SSH box with the reversing tools
    server { listen 2223; set $upstream draco-box:22; proxy_pass $upstream; }

    # Orion
    server { listen 8091; set $upstream saiph:8000; proxy_pass $upstream; }
    server { listen 8092; set $upstream meissa:8000; proxy_pass $upstream; }

    # Scorpius
    server { listen 9021; set $upstream fang:9001; proxy_pass $upstream; }
    server { listen 9022; set $upstream larawag:9001; proxy_pass $upstream; }
}
