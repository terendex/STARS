name: stars-demo

# A small demo CTF that runs beside the real one: 2 Easy challenges per
# category, none of which are in the real event, so it's safe to show players.
# Use scripts\demo.ps1 to set it up, start it and stop it. It has its own CTFd,
# accounts and scores, and these ports:
#   8100 CTFd   2221 SSH box   2223 Draco box   8091-8092 Orion   9021-9022 Scorpius

# Shared limits for anything players can touch.
x-challenge: &challenge
  restart: on-failure
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [challenges]
  cpus: 1.0
  mem_limit: 256m
  pids_limit: 128

x-web: &web
  <<: *challenge
  build: "./challenges/orion (web)/web-box"
  tmpfs:
    - /tmp

services:
  # --- Scoreboard ---------------------------------------------------------
  ctfd:
    image: ctfd/ctfd:3.8.9
    restart: on-failure
    ports:
      - "${CTF_BIND_IP}:8100:8000"
    environment:
      UPLOAD_FOLDER: /var/uploads
      DATABASE_URL: mysql+pymysql://ctfd:${DB_PASSWORD}@db/ctfd
      REDIS_URL: redis://cache:6379
      SECRET_KEY: ${SECRET_KEY}
      WORKERS: 1
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      # Everyone who opens the demo is signed in as this player, so nobody has
      # to log in. Leave it empty to require logins again.
      STARS_DEMO_AUTOLOGIN: demo1
    volumes:
      - ctfd_logs:/var/log/CTFd
      - ctfd_uploads:/var/uploads
      # Demo-only changes: its own login cookie, so it doesn't sign you out of
      # the real CTF, and the automatic sign-in above.
      - ./ctfd-plugin:/opt/CTFd/CTFd/plugins/stars_demo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on: [db, cache]
    networks: [ctfd_public, ctfd_internal]

  db:
    image: mariadb:10.11
    restart: on-failure
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ctfd
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
    networks: [ctfd_internal]

  cache:
    image: redis:4
    restart: on-failure
    volumes:
      - cache_data:/data
    networks: [ctfd_internal]

  # --- Challenge entry point ----------------------------------------------
  edge:
    <<: *challenge
    image: nginx:stable
    cap_add: [CHOWN, SETGID, SETUID]
    tmpfs:
      - /tmp
      - /var/cache/nginx
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${CTF_BIND_IP}:2221:2221"
      - "${CTF_BIND_IP}:2223:2223"
      - "${CTF_BIND_IP}:8091-8092:8091-8092"
      - "${CTF_BIND_IP}:9021-9022:9021-9022"
    networks: [edge_public, challenges]

  # --- Ursa Minor: SSH box, also the SSH route into Scorpius ---------------
  # Same Dockerfile as the real SSH box, with the demo's own levels.
  ssh-box:
    <<: *challenge
    build:
      context: "./challenges/ursa-minor (linux)/ssh-box"
      dockerfile: "../../../../challenges/ursa-minor (linux)/ssh-box/Dockerfile"
    cap_add: [CHOWN, SETGID, SETUID, SYS_CHROOT, KILL, AUDIT_WRITE]
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 1024
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /run:size=1m,mode=755
      - /dev/shm:ro,size=4k
      - /dev/mqueue:ro,size=4k

  # --- Draco: SSH box with the reversing tools ------------------------------
  # Same Dockerfile as the real Draco box, with the demo's own levels.
  draco-box:
    <<: *challenge
    build:
      context: "./challenges/draco (reversing)/draco-box"
      dockerfile: "../../../../challenges/draco (reversing)/draco-box/Dockerfile"
    cap_add: [CHOWN, SETGID, SETUID, SYS_CHROOT, KILL, AUDIT_WRITE]
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 1024
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /run:size=1m,mode=755
      - /dev/shm:ro,size=4k
      - /dev/mqueue:ro,size=4k

  # --- Orion ---------------------------------------------------------------
  saiph:
    <<: *web
    command: ["saiph:app"]

  meissa:
    <<: *web
    command: ["meissa:app"]

  # --- Scorpius ------------------------------------------------------------
  # Same Dockerfile as the real Scorpius stars. Each image only has its own flag.
  fang:
    <<: *challenge
    build:
      context: "./challenges/scorpius (pwn)"
      dockerfile: "../../../challenges/scorpius (pwn)/Dockerfile"
      target: service
      args: {STAR: fang}

  larawag:
    <<: *challenge
    build:
      context: "./challenges/scorpius (pwn)"
      dockerfile: "../../../challenges/scorpius (pwn)/Dockerfile"
      target: service
      args: {STAR: larawag}

  # --- Tools --------------------------------------------------------------
  # Mounts the whole STARS folder so the shared scripts are available, but
  # runs from demo/, where the demo's .ctf/config lives.
  ctfcli:
    build: ../tools/ctfcli
    profiles: [tools]
    volumes:
      - ..:/work
    working_dir: /work/demo
    networks: [ctfd_internal]

volumes:
  ctfd_logs:
  ctfd_uploads:
  db_data:
  cache_data:

networks:
  ctfd_public:
  ctfd_internal:
    internal: true
  edge_public:
  challenges:
    internal: true
