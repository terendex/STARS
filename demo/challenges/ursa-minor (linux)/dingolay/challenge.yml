  Dingolay is the star 11 Ursae Minoris, home to a giant planet called Ramajay. Our survey of it logged twenty thousand readings, and one of them carries the flag.

  Scrolling through them all would take all night. Linux has a command that searches inside a file and prints only the lines that match.

  **Your goal:** find the one line in `sky_survey.log` that contains the flag.

  Log in with the password `ramajay`.

  **Commands you may need to solve this level:** `ls`, `grep`
