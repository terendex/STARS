description: |-
  Meissa is the star at Orion's head. Its observation log lists entries 1 to 5, and each one opens at its own address. Open one and look at the address bar: the number at the end decides which entry you see, and nothing stops you from changing it.

  The log has one more entry that isn't listed. To find it, change that number and press Enter. Try numbers after the last listed entry, and before the first.

  **Your goal:** open Meissa's log at the address below, and find the entry that isn't listed on its main page. The flag is in it.

  **Tools you may need to solve this level:** Your browser's address bar
