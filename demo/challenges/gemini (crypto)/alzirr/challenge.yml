  Alzirr, a star in Gemini, sent its message with one of the oldest ciphers there is. The alphabet is flipped, so A becomes Z, B becomes Y, C becomes X, and so on. Numbers and symbols aren't changed.

  **Your goal:** decode `message.txt` (download it below) to read the flag.

