# Settings for SonarQube Cloud (SonarCloud), which checks each commit pushed to
# GitHub and puts a green tick or a red X next to it. It reads this file by itself.
#
# The challenges are insecure on purpose: SQL injection, buffer overflows,
# passwords and flags written into the code, and copies of each other (SITS
# remixes STARS, Classic keeps the old ones). SonarCloud would report all of
# that as bugs and security holes. So it skips every CTF's challenges folder and
# only checks STARS's own code: the scripts and the CTFd plugin.
sonar.exclusions=**/challenges/**
