worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Docker's DNS. Looking names up per connection means one stopped challenge
    # can't stop the proxy from starting, and rebuilt challenges are found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    # Keep delivering a program's output after the client has finished sending.
    proxy_half_close on;

    # Ursa Minor: shared SSH box
    server { listen 2220; set $upstream ssh-box:22; proxy_pass $upstream; }

    # Orion
    server { listen 8081; set $upstream rigel:8000; proxy_pass $upstream; }
    server { listen 8082; set $upstream betelgeuse:8000; proxy_pass $upstream; }
    server { listen 8083; set $upstream bellatrix:8000; proxy_pass $upstream; }
    server { listen 8084; set $upstream mintaka:8000; proxy_pass $upstream; }
    server { listen 8085; set $upstream alnilam:8000; proxy_pass $upstream; }
    server { listen 8086; set $upstream alnitak:8000; proxy_pass $upstream; }

    # Scorpius
    server { listen 9001; set $upstream antares:9001; proxy_pass $upstream; }
    server { listen 9002; set $upstream shaula:9001; proxy_pass $upstream; }
    server { listen 9003; set $upstream sargas:9001; proxy_pass $upstream; }
    server { listen 9004; set $upstream lesath:9001; proxy_pass $upstream; }
    server { listen 9005; set $upstream dschubba:9001; proxy_pass $upstream; }
    server { listen 9006; set $upstream acrab:9001; proxy_pass $upstream; }
}
